name: Post-Publish Smoke Test
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string

concurrency:
  group: smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Wait for Maven Central propagation
        run: |
          # inputs.version is wrapper version (0.1.x), fallback to VERSION file
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION=$(cat VERSION | tr -d ' \n'); fi
          URL="https://repo1.maven.org/maven2/io/github/tdlib-android/core/$VERSION/core-$VERSION.pom"
          SEARCH_URL="https://search.maven.org/solrsearch/select?q=g:%22io.github.tdlib-android%22+AND+a:%22core%22+AND+v:%22$VERSION%22&rows=1&wt=json"
          echo "Polling Maven Central for $URL..."
          for i in {1..40}; do
            STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" "$URL")
            if [ "$STATUS" -eq 200 ]; then
              echo "Artifact found on Maven Central! Proceeding."
              exit 0
            fi
            # Fallback: check search index (covers portal staging delay)
            if curl -s "$SEARCH_URL" | grep -q "\"v\":\"$VERSION\""; then
              echo "Artifact found via search index! Proceeding."
              exit 0
            fi
            echo "Attempt $i/40: Not found yet (HTTP $STATUS). Waiting 30s..."
            echo "If this persists, check Central Portal deployment status for $VERSION."
            sleep 30
          done
          echo "Timeout waiting for Maven Central propagation."
          echo "Check https://central.sonatype.com/publishing/deployments and confirm autoPublish is enabled."
          exit 1

      - name: Pull artifact from Maven Central and test
        run: |
          VERSION="${{ inputs.version }}"
          echo "=== Setting up robust Maven Central smoke test for version $VERSION ==="
          mkdir -p /tmp/smoke_test/app/src/main/java/io/github/tdlibandroid/smoke

          # 1. settings.gradle.kts
          cat > /tmp/smoke_test/settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include(":app")
          EOF
          # Strip heredoc indentation
          sed -i 's/^          //' /tmp/smoke_test/settings.gradle.kts

          # 2. build.gradle.kts (root)
          cat > /tmp/smoke_test/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.4.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF
          sed -i 's/^          //' /tmp/smoke_test/build.gradle.kts

          # 3. app/build.gradle.kts
          cat > /tmp/smoke_test/app/build.gradle.kts << EOF
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "io.github.tdlibandroid.smoke"
              compileSdk = 34
              defaultConfig {
                  applicationId = "io.github.tdlibandroid.smoke"
                  minSdk = 26
                  targetSdk = 34
              }
          }
          dependencies {
              implementation("io.github.tdlib-android:core:${VERSION}")
          }
          EOF
          sed -i 's/^          //' /tmp/smoke_test/app/build.gradle.kts

          # 4. SmokeTest.java
          cat > /tmp/smoke_test/app/src/main/java/io/github/tdlibandroid/smoke/SmokeTest.java << 'EOF'
          package io.github.tdlibandroid.smoke;
          import org.drinkless.tdlib.TdApi;
          public class SmokeTest {
              public static void test() {
                  TdApi.GetOption opt = new TdApi.GetOption("version");
                  System.out.println(opt.toString());
              }
          }
          EOF
          sed -i 's/^          //' /tmp/smoke_test/app/src/main/java/io/github/tdlibandroid/smoke/SmokeTest.java

          cd /tmp/smoke_test
          # Generate gradle wrapper so we don't depend on system gradle
          gradle wrapper --gradle-version 8.7 2>/dev/null || true
          echo "=== Starting compilation to verify library classpath integrity ==="
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:compileReleaseJavaWithJavac --no-daemon
          else
            gradle :app:compileReleaseJavaWithJavac --no-daemon
          fi

      - name: Open issue if smoke test failed
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create -R AkashPriyadarshii/tdlib-android \
            --title "PUBLISH BROKEN: v${{ inputs.version }} fails Maven Central smoke test" \
            --body "The published artifact on Maven Central fails to compile. Immediate attention needed. Consider deprecating this release." \
            || echo "Issue creation skipped (missing issues:write or duplicate)."
