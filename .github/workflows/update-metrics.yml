name: Update Downloads Chart

on:
  schedule:
    # Run once every 14 days at 00:00 UTC
    - cron: "0 0 1,15 * *"
  workflow_dispatch:

concurrency:
  group: update-downloads-metrics
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate downloads chart
        run: python scripts/generate_downloads_chart.py

      - name: Commit and push if chart changed
        run: |
          git config user.name "AkashPriyadarshii"
          git config user.email "272530059+AkashPriyadarshii@users.noreply.github.com"
          if git diff --quiet docs/downloads-chart.svg docs/downloads-badge.json; then
            echo "No change in download metrics chart or badge."
            exit 0
          fi
          git add docs/downloads-chart.svg docs/downloads-badge.json
          git commit -m "chore: update downloads metrics chart and badge [skip ci]"
          # Retry push: refetch + rebase; generated files are deterministic
          # so on conflict keep our freshly generated copy.
          for i in 1 2 3; do
            git fetch origin main
            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then
                echo "Pushed on attempt $i."
                exit 0
              fi
            else
              git rebase --abort || true
              git reset --soft origin/main
              git add docs/downloads-chart.svg docs/downloads-badge.json
              git commit -m "chore: update downloads metrics chart and badge [skip ci]" || true
            fi
            sleep 10
          done
          echo "Push failed after 3 attempts."
          exit 1
