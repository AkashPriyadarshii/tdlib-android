name: Build TDLib Android AAR
on:
  pull_request:
  workflow_call:
    inputs:
      new_version:
        required: true
        type: string
      old_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      new_version:
        required: true
        type: string
      old_version:
        required: false
        type: string
        default: "unknown"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-abi:
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64, x86]
      fail-fast: true   # If one ABI fails, cancel others — never publish partial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from file
        id: get-ver
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Add Swap Space (10GB)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Build TDLib for ${{ matrix.abi }}
        id: build
        env:
          ABI: ${{ matrix.abi }}
          TDLIB_VERSION: ${{ inputs.new_version || steps.get-ver.outputs.version }}
        run: |
          set -euo pipefail
          ./scripts/build-tdlib.sh "$ABI" "$TDLIB_VERSION"

      - name: Upload ABI artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-${{ matrix.abi }}
          path: artifacts/
          retention-days: 7

  emulator-test:
    needs: build-abi
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [34]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Download all ABI artifacts for TDLib
        uses: actions/download-artifact@v4
        with:
          pattern: tdlib-*
          merge-multiple: true
          path: downloaded_artifacts/
        continue-on-error: true

      - name: Stage .so files and TdApi.java if artifacts exist
        run: |
          if [ -d "downloaded_artifacts/arm64-v8a" ]; then
            mkdir -p core/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64,x86}
            cp downloaded_artifacts/arm64-v8a/libtdjni.so core/src/main/jniLibs/arm64-v8a/
            cp downloaded_artifacts/armeabi-v7a/libtdjni.so core/src/main/jniLibs/armeabi-v7a/
            cp downloaded_artifacts/x86_64/libtdjni.so core/src/main/jniLibs/x86_64/
            cp downloaded_artifacts/x86/libtdjni.so core/src/main/jniLibs/x86/
            mkdir -p core/src/main/java/org/drinkless/tdlib
            cp downloaded_artifacts/java/org/drinkless/tdlib/TdApi.java core/src/main/java/org/drinkless/tdlib/
            cp downloaded_artifacts/java/org/drinkless/tdlib/Client.java core/src/main/java/org/drinkless/tdlib/ || echo "Client.java not present"
          fi

      - name: Restore Pristine Gradle Wrapper JAR
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Inject API Credentials for Test
        run: |
          mkdir -p telegram-storage-mvp/app/src/androidTest/assets
          echo "apiId=${{ secrets.TELEGRAM_API_ID }}" > telegram-storage-mvp/app/src/androidTest/assets/secrets.properties
          echo "apiHash=${{ secrets.TELEGRAM_API_HASH }}" >> telegram-storage-mvp/app/src/androidTest/assets/secrets.properties

      - name: Run Android UI Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: Nexus 6
          script: cd telegram-storage-mvp && ../gradlew :app:connectedDebugAndroidTest
        env:
          # Used so the test can compile with the app folder
          ORG_GRADLE_PROJECT_android_test: "true"

  package-and-publish:
    needs: [build-abi, emulator-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Get version from file
        id: get-ver
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download all ABI artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tdlib-*
          merge-multiple: true
          path: downloaded_artifacts/

      - name: Verify 4 ABIs present and valid (readelf)
        run: |
          chmod +x ./scripts/verify-abi-count.sh
          ./scripts/verify-abi-count.sh downloaded_artifacts/

      - name: Stage .so files and TdApi.java
        run: |
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            mkdir -p "core/src/main/jniLibs/$ABI"
            cp "downloaded_artifacts/$ABI/libtdjni.so" "core/src/main/jniLibs/$ABI/"
          done
          mkdir -p core/src/main/java/org/drinkless/tdlib
          cp downloaded_artifacts/java/org/drinkless/tdlib/TdApi.java core/src/main/java/org/drinkless/tdlib/
          cp downloaded_artifacts/java/org/drinkless/tdlib/Client.java core/src/main/java/org/drinkless/tdlib/ || echo "Client.java not present - using template"

      - name: Verify TdApi.java is complete
        run: |
          SIZE=$(stat -c%s core/src/main/java/org/drinkless/tdlib/TdApi.java)
          if [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: TdApi.java is too small (${SIZE} bytes) — likely incomplete"
            exit 1
          fi

      - name: Restore Pristine Gradle Wrapper JAR
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Build AAR
        run: |
          chmod +x gradlew
          ./gradlew :core:assembleRelease :ktx:assembleRelease || gradle :core:assembleRelease :ktx:assembleRelease

      - name: Smoke test — load AAR
        run: |
          chmod +x ./scripts/smoke-test.sh
          ./scripts/smoke-test.sh

      - name: Compute checksums
        run: |
          sha256sum core/build/outputs/aar/core-release.aar > core-release.aar.sha256
          for ABI in arm64-v8a armeabi-v7a x86_64 x86; do
            sha256sum "core/src/main/jniLibs/$ABI/libtdjni.so" >> checksums.txt
          done

      - name: Upload final AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-aar-${{ inputs.new_version || steps.get-ver.outputs.version }}
          path: |
            core/build/outputs/aar/core-release.aar
            ktx/build/outputs/aar/ktx-release.aar
            checksums.txt
          retention-days: 30

      - name: Generate TdApi.java diff
        run: |
          OLD_VER="${{ inputs.old_version || 'unknown' }}"
          # Diff against last shipped version (stored in git)
          git diff HEAD -- "docs/api-snapshots/TdApi_${OLD_VER}.java" \
            "core/src/main/java/org/drinkless/tdlib/TdApi.java" \
            > tdapi_diff.txt 2>/dev/null || echo "First version — no diff available" > tdapi_diff.txt

      - name: Publish to Maven Central
        if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BACKOFF=10
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt"
            if ./gradlew publishAllPublicationsToMavenCentralRepository || gradle publishAllPublicationsToMavenCentralRepository; then
              echo "Published successfully"
              break
            fi
            if [ $attempt -eq 5 ]; then
              echo "PUBLISH_FAILED after 5 attempts"
              gh issue create --title "PUBLISH FAILED: TDLib $(cat VERSION)" --body "Failed to publish." --label "publish-failed,urgent"
              exit 1
            fi
            sleep $BACKOFF
            BACKOFF=$((BACKOFF * 2))
          done

      - name: Create GitHub Release
        if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ inputs.new_version }}
        run: |
          gh release create "v${NEW_VERSION}" \
            --title "TDLib ${NEW_VERSION}" \
            --notes "Prebuilt TDLib Android AAR distribution. Boost Software License 1.0." \
            core/build/outputs/aar/core-release.aar \
            ktx/build/outputs/aar/ktx-release.aar \
            checksums.txt

      - name: Commit version bump directly to main
        if: github.event_name == 'workflow_call' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ inputs.new_version }}
          OLD_VERSION: ${{ inputs.old_version }}
        run: |
          git config user.name "tdlib-android-bot"
          git config user.email "bot@tdlib-android.github.io"
          
          # Update VERSION file
          echo "$NEW_VERSION" > VERSION
          
          # Store TdApi snapshot for future diffs
          mkdir -p docs/api-snapshots
          cp core/src/main/java/org/drinkless/tdlib/TdApi.java \
             "docs/api-snapshots/TdApi_${NEW_VERSION}.java"

          # Save schema hash
          UPSTREAM_HASH=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/tdlib/td/commits?path=td/generate/scheme/td_api.tl&per_page=1" \
            | jq -r '.[0].sha')
          echo "$UPSTREAM_HASH" > .tdl_schema_hash

          # Update README
          sed -i "s/TDLib-[0-9.]*/TDLib-${NEW_VERSION}/" README.md || true
          
          git add VERSION docs/api-snapshots/ .tdl_schema_hash README.md
          git commit -m "chore: release TDLib ${NEW_VERSION} [skip ci]"
          git push origin main

