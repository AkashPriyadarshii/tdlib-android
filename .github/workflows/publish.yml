name: Publish to Maven Central
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.gitattributes'

jobs:
  publish:
    if: github.event.pull_request.merged == true &&
        contains(github.event.pull_request.labels.*.name, 'version-bump')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set Version
        id: set-version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "NEW_VERSION=$VERSION" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download AAR artifact
        id: download-artifact
        uses: actions/download-artifact@v4
        with:
          name: tdlib-android-aar-${{ env.NEW_VERSION }}
        continue-on-error: true  # Artifact may have expired if PR sat >30 days

      - name: Rebuild AAR if artifact expired
        if: steps.download-artifact.outcome == 'failure'
        run: |
          # Re-run build inline — handles the case where PR took >30 days
          echo "Artifact expired — rebuilding..."
          chmod +x ./scripts/build-tdlib.sh
          ./scripts/build-tdlib.sh "arm64-v8a" "$(cat VERSION)"
          ./scripts/build-tdlib.sh "armeabi-v7a" "$(cat VERSION)"
          ./scripts/build-tdlib.sh "x86_64" "$(cat VERSION)"
          ./scripts/build-tdlib.sh "x86" "$(cat VERSION)"
          # Stage the compiled .so libraries and Java interfaces
          mkdir -p core/src/main/jniLibs/{arm64-v8a,armeabi-v7a,x86_64,x86}
          cp -r artifacts/arm64-v8a/libtdjni.so core/src/main/jniLibs/arm64-v8a/
          cp -r artifacts/armeabi-v7a/libtdjni.so core/src/main/jniLibs/armeabi-v7a/
          cp -r artifacts/x86_64/libtdjni.so core/src/main/jniLibs/x86_64/
          cp -r artifacts/x86/libtdjni.so core/src/main/jniLibs/x86/
          mkdir -p core/src/main/java/org/drinkless/tdlib
          cp -r artifacts/java/org/drinkless/tdlib/TdApi.java core/src/main/java/org/drinkless/tdlib/
          cp -r artifacts/java/org/drinkless/tdlib/Client.java core/src/main/java/org/drinkless/tdlib/ || echo "Client.java not present"
          mkdir -p gradle/wrapper
          wget -qO gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ./gradlew :core:assembleRelease :ktx:assembleRelease || gradle :core:assembleRelease :ktx:assembleRelease

      - name: Publish to Maven Central (with retry)
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_KEY_PASSWORD }}
        run: |
          mkdir -p gradle/wrapper
          wget -qO gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          # Retry loop: 5 attempts, exponential backoff
          BACKOFF=10
          for attempt in 1 2 3 4 5; do
            echo "Publish attempt $attempt"
            if ./gradlew publishAllPublicationsToMavenCentralRepository || gradle publishAllPublicationsToMavenCentralRepository; then
              echo "Published successfully"
              break
            fi
            if [ $attempt -eq 5 ]; then
              echo "PUBLISH_FAILED after 5 attempts"
              # Error handling: open GitHub Issue
              gh issue create \
                --title "PUBLISH FAILED: TDLib $(cat VERSION) not on Maven Central" \
                --body "All 5 publish attempts failed. Artifact is built and staged. Manual intervention needed." \
                --label "publish-failed,urgent"
              exit 1
            fi
            echo "Attempt $attempt failed. Waiting ${BACKOFF}s..."
            sleep $BACKOFF
            BACKOFF=$((BACKOFF * 2))
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION)
          gh release create "v${VERSION}" \
            --title "TDLib ${VERSION}" \
            --notes "Prebuilt TDLib Android AAR distribution. Boost Software License 1.0." \
            core/build/outputs/aar/core-release.aar \
            ktx/build/outputs/aar/ktx-release.aar \
            checksums.txt

      - name: Update README badge version
        run: |
          VERSION=$(cat VERSION)
          sed -i "s/TDLib-[0-9.]*/TDLib-${VERSION}/" README.md
          git config user.name "tdlib-android-bot"
          git config user.email "bot@tdlib-android.github.io"
          git add README.md
          git commit -m "docs: update README badge to TDLib ${VERSION}" || true
          git push origin main || true

  trigger-smoke-test:
    needs: publish
    uses: ./.github/workflows/smoke-test-publish.yml
    with:
      version: ${{ needs.publish.outputs.version }}
    secrets: inherit
