<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 486" width="100%" height="100%">
    <defs>
        <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#161b22" />
            <stop offset="100%" stop-color="#0d1117" />
        </linearGradient>
    </defs>
    <style>
        .bg { fill: #0d1117; }
        .border { stroke: #30363d; stroke-width: 1; fill: none; }
        .header-title { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 700; fill: #f0f6fc; }
        .header-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
        .section-title { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 700; fill: #8b949e; letter-spacing: 0.8px; text-transform: uppercase; }
        .stat-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-val { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 20px; font-weight: 700; fill: #3fb950; }
        .stat-val-sec { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 20px; font-weight: 700; fill: #58a6ff; }
        .stat-sub { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; fill: #6e7681; }
        .tag { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #f0f6fc; }
        .meta { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; fill: #6e7681; }
        .bar-val { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #f0f6fc; }
        .breakdown { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; fill: #8b949e; }
        .footer-note { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10px; fill: #484f58; }
    </style>

    <rect width="820" height="486" rx="8" class="bg" />
    <rect width="820" height="486" rx="8" class="border" />

    <!-- Header Section -->
    <text x="32" y="38" class="header-title">tdlib-android / Merged Distribution Telemetry</text>
    <text x="32" y="56" class="header-sub">Combined downloads across Maven Central / Scarf (2,711) and GitHub Releases (992)</text>

    <!-- Metrics Cards Row -->
    <g transform="translate(32, 72)">
        <!-- Card 1: Total Merged Downloads -->
        <rect x="0" y="0" width="236" height="64" rx="6" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" />
        <text x="16" y="24" class="stat-label">Total Downloads (Merged)</text>
        <text x="16" y="49" class="stat-val">3,703</text>
        <text x="110" y="49" class="stat-sub">MC: 2,711 + GH: 992</text>

        <!-- Card 2: Maven Central (Scarf Verified) -->
        <rect x="256" y="0" width="244" height="64" rx="6" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" />
        <text x="272" y="24" class="stat-label">Maven Central (Scarf)</text>
        <text x="272" y="49" class="stat-val-sec">2,711 dl</text>
        <text x="382" y="49" class="stat-sub">269 sources</text>

        <!-- Card 3: GitHub Releases AARs -->
        <rect x="520" y="0" width="236" height="64" rx="6" fill="url(#cardGrad)" stroke="#30363d" stroke-width="1" />
        <text x="536" y="24" class="stat-label">GitHub Direct AAR Downloads</text>
        <text x="536" y="49" class="stat-val">992</text>
        <text x="614" y="49" class="stat-sub">4 ABIs: 789</text>
    </g>

    <!-- Section 1: Maven Central Packages -->
    <g>
        <text x="32" y="174" class="section-title">Maven Central Packages (via Scarf)</text>
        <line x1="32" y1="182" x2="788" y2="182" stroke="#21262d" stroke-width="1" />
        
        <g class="row" transform="translate(0, 186)">
            <text x="32" y="18" class="tag">:core (AAR)</text>
            <text x="32" y="34" class="meta">Maven Central</text>
            <rect x="150" y="8" width="440" height="24" rx="4" fill="#161b22" />
            <rect x="150" y="8" width="440" height="24" rx="4" fill="#238636" />
            <text x="604" y="25" class="bar-val">1,572 dl</text>
            <text x="690" y="24" class="breakdown">4 ABIs embedded</text>
        </g>
        
        <g class="row" transform="translate(0, 238)">
            <text x="32" y="18" class="tag">:ktx (Flow)</text>
            <text x="32" y="34" class="meta">Maven Central</text>
            <rect x="150" y="8" width="440" height="24" rx="4" fill="#161b22" />
            <rect x="150" y="8" width="318" height="24" rx="4" fill="#2ea043" />
            <text x="482" y="25" class="bar-val">1,139 dl</text>
            <text x="690" y="24" class="breakdown">coroutines wrapper</text>
        </g>
        
    </g>

    <!-- Section 2: GitHub Releases -->
    <g>
        <text x="32" y="318" class="section-title">GitHub Releases (Direct Standalone AARs)</text>
        <line x1="32" y1="326" x2="788" y2="326" stroke="#21262d" stroke-width="1" />
        
        <g class="row" transform="translate(0, 330)">
            <text x="32" y="18" class="tag">v0.1.1</text>
            <text x="32" y="34" class="meta">2026-09-13</text>
            <rect x="150" y="8" width="440" height="24" rx="4" fill="#161b22" />
            <rect x="150" y="8" width="21" height="24" rx="4" fill="#238636" />
            <rect x="171" y="8" width="10" height="24" rx="0" fill="#2ea043" />
            <text x="195" y="25" class="bar-val">112 dl</text>
            <text x="690" y="24" class="breakdown">core: 76 | ktx: 25</text>
        </g>
        
        <g class="row" transform="translate(0, 382)">
            <text x="32" y="18" class="tag">v0.1.0</text>
            <text x="32" y="34" class="meta">2026-06-17</text>
            <rect x="150" y="8" width="440" height="24" rx="4" fill="#161b22" />
            <rect x="150" y="8" width="199" height="24" rx="4" fill="#238636" />
            <rect x="349" y="8" width="47" height="24" rx="0" fill="#2ea043" />
            <text x="410" y="25" class="bar-val">880 dl</text>
            <text x="690" y="24" class="breakdown">core: 713 | ktx: 133</text>
        </g>
        
    </g>

    <!-- Footer -->
    <line x1="32" y1="454" x2="788" y2="454" stroke="#21262d" stroke-width="1" />
    <text x="32" y="471" class="footer-note">Distribution: Maven Central (io.github.tdlib-android via Scarf) + GitHub Releases | Updated 2026-10-01 05:34 UTC</text>
</svg>
