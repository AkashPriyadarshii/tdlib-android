<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 556" width="100%" height="100%">
    <style>
        .bg { fill: #F7F4EC; }
        .band { fill: #EFEBDF; }
        .panel { fill: #FCFAF4; stroke: #DCD7C6; stroke-width: 1; }
        .border { stroke: #C8C3AE; stroke-width: 1; fill: none; }
        .rule { stroke: #DCD7C6; stroke-width: 1; }
        .header-title { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; font-weight: 700; fill: #191C15; }
        .header-sub { font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 12.5px; fill: #454A3D; }
        .section-title { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px; font-weight: 600; fill: #454A3D; }
        .stat-label { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; font-weight: 500; fill: #6E7263; }
        .stat-val-ac { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 22px; font-weight: 700; fill: #0F7B45; }
        .stat-val { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 22px; font-weight: 700; fill: #191C15; }
        .stat-sub { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; fill: #6E7263; }
        .tag { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; font-weight: 600; fill: #191C15; }
        .meta { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; fill: #6E7263; }
        .bar-val { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; font-weight: 600; fill: #191C15; }
        .breakdown { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; fill: #454A3D; }
        .footer-note { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 10.5px; fill: #6E7263; }
    </style>

    <rect width="820" height="556" rx="14" class="bg" />
    <rect x="0" y="516" width="820" height="40" rx="14" class="band" />
    <rect x="0" y="516" width="820" height="14" class="band" />
    <rect width="820" height="556" rx="14" class="border" />

    <!-- Header Section -->
    <text x="32" y="38" class="header-title">tdlib-android / distribution telemetry</text>
    <text x="32" y="58" class="header-sub">Combined downloads across Maven Central via Scarf (25,259) and GitHub Releases (988)</text>

    <!-- Metrics Cards Row -->
    <g transform="translate(32, 76)">
        <!-- Card 1: Total Merged Downloads -->
        <rect x="0" y="0" width="236" height="68" rx="8" class="panel" />
        <text x="16" y="23" class="stat-label">Total downloads (merged)</text>
        <text x="16" y="50" class="stat-val-ac">26,247</text>
        <text x="112" y="50" class="stat-sub">MC 25,259 + GH 988</text>

        <!-- Card 2: Maven Central (Scarf Verified) -->
        <rect x="256" y="0" width="244" height="68" rx="8" class="panel" />
        <text x="272" y="23" class="stat-label">Maven Central (Scarf)</text>
        <text x="272" y="50" class="stat-val">25,259</text>
        <text x="372" y="50" class="stat-sub">1073 sources</text>

        <!-- Card 3: GitHub Releases AARs -->
        <rect x="520" y="0" width="236" height="68" rx="8" class="panel" />
        <text x="536" y="23" class="stat-label">GitHub direct AARs</text>
        <text x="536" y="50" class="stat-val">988</text>
        <text x="614" y="50" class="stat-sub">4 ABIs · 814 core</text>
    </g>

    <!-- Section 1: Maven Central Packages -->
    <g>
        <text x="32" y="178" class="section-title">Maven Central packages (Scarf)</text>
        <line x1="32" y1="186" x2="788" y2="186" class="rule" />
        
        <g class="row" transform="translate(0, 194)">
            <text x="32" y="18" class="tag">:core (AAR)</text>
            <text x="32" y="34" class="meta">Maven Central</text>
            <rect x="150" y="8" width="440" height="24" rx="5" fill="#EFEBDF" stroke="#DCD7C6" stroke-width="1" />
            <rect x="150" y="8" width="440" height="24" rx="5" fill="#0F7B45" />
            <text x="604" y="25" class="bar-val">18,831 dl</text>
            <text x="690" y="24" class="breakdown">4 ABIs embedded</text>
        </g>
        
        <g class="row" transform="translate(0, 246)">
            <text x="32" y="18" class="tag">:ktx (Flow)</text>
            <text x="32" y="34" class="meta">Maven Central</text>
            <rect x="150" y="8" width="440" height="24" rx="5" fill="#EFEBDF" stroke="#DCD7C6" stroke-width="1" />
            <rect x="150" y="8" width="150" height="24" rx="5" fill="#0B6136" />
            <text x="314" y="25" class="bar-val">6,428 dl</text>
            <text x="690" y="24" class="breakdown">coroutines wrapper</text>
        </g>
        
    </g>

    <!-- Section 2: GitHub Releases -->
    <g>
        <text x="32" y="328" class="section-title">GitHub Releases (standalone AARs)</text>
        <line x1="32" y1="336" x2="788" y2="336" class="rule" />
        
        <g class="row" transform="translate(0, 344)">
            <text x="32" y="18" class="tag">v0.1.3</text>
            <text x="32" y="34" class="meta">2026-11-27</text>
            <rect x="150" y="8" width="440" height="24" rx="5" fill="#EFEBDF" stroke="#DCD7C6" stroke-width="1" />
            <rect x="150" y="8" width="4" height="24" rx="5" fill="#0F7B45" />
            <rect x="154" y="8" width="4" height="24" rx="2" fill="#454A3D" />
            <text x="172" y="25" class="bar-val">8 dl</text>
            <text x="690" y="24" class="breakdown">core: 4 | ktx: 1</text>
        </g>
        
        <g class="row" transform="translate(0, 396)">
            <text x="32" y="18" class="tag">v0.1.1</text>
            <text x="32" y="34" class="meta">2026-09-13</text>
            <rect x="150" y="8" width="440" height="24" rx="5" fill="#EFEBDF" stroke="#DCD7C6" stroke-width="1" />
            <rect x="150" y="8" width="6" height="24" rx="5" fill="#0F7B45" />
            <rect x="156" y="8" width="2" height="24" rx="2" fill="#454A3D" />
            <text x="172" y="25" class="bar-val">15 dl</text>
            <text x="690" y="24" class="breakdown">core: 13 | ktx: 1</text>
        </g>
        
        <g class="row" transform="translate(0, 448)">
            <text x="32" y="18" class="tag">v0.1.0</text>
            <text x="32" y="34" class="meta">2026-06-17</text>
            <rect x="150" y="8" width="440" height="24" rx="5" fill="#EFEBDF" stroke="#DCD7C6" stroke-width="1" />
            <rect x="150" y="8" width="18" height="24" rx="5" fill="#0F7B45" />
            <rect x="168" y="8" width="4" height="24" rx="2" fill="#454A3D" />
            <text x="186" y="25" class="bar-val">965 dl</text>
            <text x="690" y="24" class="breakdown">core: 797 | ktx: 133</text>
        </g>
        
    </g>

    <!-- Footer -->
    <line x1="0" y1="516" x2="820" y2="516" class="rule" />
    <text x="32" y="540" class="footer-note">Sources: Maven Central (io.github.tdlib-android via Scarf) + GitHub Releases  ·  Updated 2026-11-28 16:03 UTC</text>
</svg>
